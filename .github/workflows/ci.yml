name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  image-scan:
    name: Build image & security scans
    runs-on: ubuntu-latest
    needs: quality
    # Snyk/Sonar run only when their tokens are configured.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scipio:ci
          build-args: |
            VERSION=ci
            GIT_COMMIT=${{ github.sha }}

      # Filesystem (dependencies + config) scan.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          # TODO: raise to '1' + set severity gate once the security policy is finalised.
          exit-code: '0'
          ignore-unfixed: true

      # Built image scan.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: scipio:ci
          format: table
          # TODO: raise to '1' + set severity gate once the security policy is finalised.
          exit-code: '0'
          ignore-unfixed: true

      - name: Snyk (dependencies)
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
        continue-on-error: true # TODO: enforce once policy is finalised.

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
