name: Release

# Releases are cut by pushing a version tag, e.g. `v2026.9.0`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  IMAGE: techblog/scipio

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }} # via env — injection-safe
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          [ -n "$VERSION" ] || { echo "::error::empty version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # amd64 + arm64 only: Chromium + Node 22 on armhf is not worth it (see README).
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        # TODO: pin to a commit SHA for release-critical use.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
